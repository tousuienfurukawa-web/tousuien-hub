name: Extract and Check Orders

on:
  workflow_dispatch:
    inputs:
      invoice:
        description: '受注番号 (例: TSE-IST-003-25)'
        required: true
        default: 'TSE-IST-003-25'

jobs:
  extract-and-check:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: 🐍 Python 3.11 をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 依存関係をインストール
        run: |
          pip install pandas openpyxl

      - name: 📂 distディレクトリの確認
        run: |
          echo "=== dist/ の内容 ==="
          ls -lah dist/ || echo "⚠️ dist/ が存在しません"

      - name: 📄 受注データの存在確認
        run: |
          if [ -f "dist/受注登録.csv" ]; then
            echo "✅ dist/受注登録.csv が存在します"
            head -n 5 dist/受注登録.csv
          elif [ -f "dist/受注登録.csv.gz" ]; then
            echo "✅ dist/受注登録.csv.gz が存在します"
            gunzip -c dist/受注登録.csv.gz | head -n 5
          else
            echo "❌ 受注登録ファイルが見つかりません"
            exit 1
          fi

      - name: 🔍 受注番号を検索
        run: |
          python scripts/handle_order_command.py --invoice "${{ github.event.inputs.invoice }}"
