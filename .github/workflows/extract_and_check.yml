name: Extract and Check Orders

on:
  workflow_dispatch:
    inputs:
      invoice:
        description: '受注番号 (例: TSE-IST-003-24)'
        required: true
        default: 'TSE-IST-003-24'  # ← 存在する受注番号に変更

jobs:
  extract-and-check:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: 🐍 Python 3.11 をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 依存関係をインストール
        run: |
          pip install pandas openpyxl

      - name: 🔍 受注番号を検索
        run: |
          python scripts/handle_order_command.py --invoice "${{ github.event.inputs.invoice }}"
