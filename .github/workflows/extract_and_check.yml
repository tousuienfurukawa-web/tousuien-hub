name: Extract and Check Orders

on:
  workflow_dispatch:
    inputs:
      invoice:
        description: '受注番号 (例: TSE-IST-003-25)'
        required: true
        default: 'TSE-IST-003-25'
  push:
    paths:
      - 'data/Customer_Management_latest.xlsx'
      - 'data/Customer_Management_values.xlsx'

jobs:
  extract-and-check:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: 🐍 Python 3.11 をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 依存関係をインストール
        run: |
          pip install pandas openpyxl

      - name: 📄 Excel → CSV 抽出
        run: |
          python scripts/extract_orders_from_values.py

      - name: 📂 生成されたファイルを確認
        run: |
          echo "=== dist/ の内容 ==="
          ls -lah dist/
          echo ""
          echo "=== 受注登録.csv の内容（先頭5行） ==="
          head -n 6 dist/受注登録.csv

      - name: 🔍 受注番号を検索
        run: |
          python scripts/handle_order_command.py --invoice "${{ github.event.inputs.invoice }}"
