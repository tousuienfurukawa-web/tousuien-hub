name: Extract Order Info

on:
  workflow_dispatch:
    inputs:
      invoice:
        description: 'Invoice number to check'
        required: true
        default: 'TSE-IST-003-25'

jobs:
  extract-order:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🧪 Install dependencies
        run: pip install pandas

      - name: 📦 Run order extraction script
        run: |
          python scripts/handle_order_command.py --invoice "${{ github.event.inputs.invoice }}"
