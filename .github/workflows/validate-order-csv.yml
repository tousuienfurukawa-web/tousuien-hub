name: Validate Order CSV

on:
  pull_request:
    paths:
      - 'dist/受注登録.csv'
      - 'validate_order_csv.py'
      - 'csv_clean.py'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install deps
        run: python -m pip install --upgrade pip
      - name: Run validation
        run: |
          python validate_order_csv.py dist/受注登録.csv
