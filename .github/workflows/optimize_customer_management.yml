name: Optimize Customer Management (minimal)

on:
  workflow_dispatch:

jobs:
  optimize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # pyarrow は環境依存で失敗することがあるため省略（必要であれば後で追加）
          pip install pandas openpyxl xlsxwriter

      - name: Create values-only workbook
        run: |
          python scripts/clean_excel.py data/Customer_Management_latest.xlsx Customer_Management_values.xlsx

      - name: Export sheets (csv.gz)
        run: |
          python scripts/export_sheets.py Customer_Management_values.xlsx dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: customer-management-dist
          path: |
            Customer_Management_values.xlsx
            dist/*
