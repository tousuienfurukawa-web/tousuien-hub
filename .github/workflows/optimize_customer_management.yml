name: Optimize Customer Management

# Allow this workflow to write to the repository (needed to commit generated files)
permissions:
  contents: write

on:
  push:
    paths:
      - 'data/Customer_Management_latest.xlsx'
  workflow_dispatch:

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Try to install pyarrow; if it fails, fall back to installing without it.
          pip install pandas openpyxl xlsxwriter pyarrow || pip install pandas openpyxl xlsxwriter

      - name: Create values-only workbook
        run: |
          python scripts/clean_excel.py data/Customer_Management_latest.xlsx Customer_Management_values.xlsx

      - name: Export sheets (csv.gz / parquet) and manifest
        run: |
          python scripts/export_sheets.py Customer_Management_values.xlsx dist

      - name: Debug: show generated files and git status
        run: |
          echo "=== repo root files ==="
          ls -la
          echo ""
          echo "=== dist (if exists) ==="
          ls -la dist || true
          echo ""
          echo "=== git status (porcelain) ==="
          git status --porcelain || true
          echo ""
          echo "=== git ls-files (tracked dist/) ==="
          git ls-files dist || true

      - name: Force add generated files (ignore .gitignore for this step)
        run: |
          # Force add in case .gitignore contains dist/ or similar
          git add -f Customer_Management_values.xlsx || true
          git add -f dist/* || true
          git status --porcelain || true

      - name: Commit optimized files
        uses: EndBug/add-and-commit@v9
        with:
          author_name: 'github-actions[bot]'
          author_email: '41898282+github-actions[bot]@users.noreply.github.com'
          message: 'chore: update optimized Customer Management exports'
          # Use space-separated paths (no commas)
          add: 'dist/* Customer_Management_values.xlsx'

      - name: Upload artifact (fallback / preserve artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: customer-management-dist
          path: |
            Customer_Management_values.xlsx
            dist/*
