name: Optimize Customer Management (minimal)

on:
  workflow_dispatch:

jobs:
  optimize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl xlsxwriter || true

      - name: Create values-only workbook
        run: |
          python scripts/clean_excel.py data/Customer_Management_latest.xlsx Customer_Management_values.xlsx

      - name: Export sheets
        run: |
          python scripts/export_sheets.py Customer_Management_values.xlsx dist

      - name: List outputs
        run: |
          echo "=== dist ==="
          ls -la dist || true
          echo "=== values file ==="
          ls -la Customer_Management_values.xlsx || true
