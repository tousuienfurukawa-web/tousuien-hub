name: Optimize Customer Management (minimal artifact-only)

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Create values-only workbook
        run: |
          python scripts/clean_excel.py data/Customer_Management_latest.xlsx Customer_Management_values.xlsx

      - name: Export sheets
        run: |
          python scripts/export_sheets.py Customer_Management_values.xlsx dist

      - name: Debug: list dist
        run: |
          echo "=== dist files ==="
          ls -la dist || true
          echo "=== values file ==="
          ls -la Customer_Management_values.xlsx || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: customer-management-dist
          path: |
            Customer_Management_values.xlsx
            dist/*
