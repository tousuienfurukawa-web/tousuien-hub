name: Generate Orders and Company Info

on:
  push:
    paths:
      - "Customer_Management_values.xlsx"
      - "scripts/extract_orders_from_values.py"
      - "scripts/extract_companies_from_values.py"

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v3

      - name: Pythonをセットアップ
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: 依存関係をインストール
        run: pip install pandas openpyxl

      - name: distディレクトリを作成
        run: mkdir -p dist

      - name: 受注登録を抽出
        run: python scripts/extract_orders_from_values.py

      - name: 会社情報登録を抽出
        run: python scripts/extract_companies_from_values.py

      - name: 出力確認
        run: ls -lh dist/
