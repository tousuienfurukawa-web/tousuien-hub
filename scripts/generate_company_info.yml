name: Extract 会社情報登録

on:
  workflow_dispatch:

jobs:
  extract-company-info:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install pandas openpyxl

      - name: Extract 会社情報登録 to dist/会社情報登録.csv.gz
        run: python scripts/extract_companies_from_values.py
